  <path d="M250 65 C218 88 183 94 153 85 C125 78 100 82 75 95 L109 222 C137 211 162 226 189 227 C221 228 258 201 300 184 Z" fill="url(#checker)" stroke="#151c2b" stroke-width="2"/>
  <path d="M430 65 C462 88 497 94 527 85 C555 78 580 82 605 95 L571 222 C543 211 518 226 491 227 C459 228 422 201 380 184 Z" fill="url(#checker)" stroke="#151c2b" stroke-width="2"/>

