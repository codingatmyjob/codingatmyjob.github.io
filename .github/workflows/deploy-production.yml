name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://codingatmyjob.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4.0.4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: echo "VITE_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV

      - run: npm run build
        env:
          PUBLIC_VOTES_API_URL: ${{ vars.PUBLIC_VOTES_API_URL }}

      - name: Deploy voting Worker and migrate D1
        if: ${{ vars.PUBLIC_VOTES_API_URL != '' }}
        working-directory: workers/votes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Voting is enabled. Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the production environment."
            exit 1
          fi
          npx --yes wrangler@4 deploy
          npx --yes wrangler@4 d1 migrations apply tangent-votes --remote

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
          keep_files: true

      - name: Check out published site for retired article cleanup
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Remove retired upvote article URLs
        working-directory: published-site
        run: |
          git rm --ignore-unmatch -- articles/cloudflare-worker-sql-article-upvotes.html articles/cloudflare-worker-sql-article-upvotes/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove retired upvote article URLs'
          git push origin HEAD:gh-pages
